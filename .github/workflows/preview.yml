name: Preview Build
on:
  workflow_dispatch:
    inputs:
jobs:
  libcore:
    name: Native Build (LibCore)
    runs-on: ubuntu-latest
    env:
      CGO_CFLAGS_ALLOW: ".*"
      CGO_CPPFLAGS_ALLOW: ".*"
      CGO_CXXFLAGS_ALLOW: ".*"
      CGO_LDFLAGS_ALLOW: ".*"
      GOPROXY: "https://proxy.golang.org,direct"
      GOSUMDB: "sum.golang.org"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Libcore Status
        run: git rev-parse HEAD:libcore HEAD:buildScript > libcore_status
      - name: LibCore Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            app/libs/libcore.aar
          key: libcore-${{ hashFiles('.github/workflows/*', 'libcore_status') }}
      - name: Install Golang
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: libcore/go.sum
      - name: Set up Swap Space
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo swapoff -a 2>/dev/null || true
          SWAP_PATH="/mnt/swapfile"
          if [ ! -d "/mnt" ]; then
            SWAP_PATH="/swapfile"
          fi
          sudo rm -f "$SWAP_PATH" /swapfile 2>/dev/null || true
          sudo fallocate -l 10G "$SWAP_PATH" 2>/dev/null || sudo dd if=/dev/zero of="$SWAP_PATH" bs=1M count=10240
          sudo chmod 600 "$SWAP_PATH"
          sudo mkswap "$SWAP_PATH"
          sudo swapon "$SWAP_PATH"
          free -h
          df -h
      - name: Native Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./run lib core
      - name: Upload LibCore Artifact
        uses: actions/upload-artifact@v4
        with:
          name: libcore-aar
          path: app/libs/libcore.aar
  build:
    name: Build OSS APK
    runs-on: ubuntu-latest
    needs:
      - libcore
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Download LibCore Artifact
        uses: actions/download-artifact@v4
        with:
          name: libcore-aar
          path: app/libs
      - name: Verify LibCore
        run: |
          if [ -f "app/libs/libcore.aar" ]; then
            echo "Found app/libs/libcore.aar"
          elif [ -f "app/libs/app/libs/libcore.aar" ]; then
            echo "Moving nested libcore.aar..."
            mv app/libs/app/libs/libcore.aar app/libs/libcore.aar
          else
            echo "Searching for libcore.aar..."
            find app/libs -name "libcore.aar" -exec mv {} app/libs/libcore.aar \;
          fi
          ls -lh app/libs/libcore.aar
      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-oss-${{ hashFiles('**/*.gradle.kts') }}
      - name: Gradle Build
        env:
          BUILD_PLUGIN: none
        run: |
          source buildScript/init/env_ndk.sh
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          echo "ndk.dir=${ANDROID_NDK_HOME}" >> local.properties
          export LOCAL_PROPERTIES="${{ secrets.LOCAL_PROPERTIES }}"
          export KEYSTORE_PASS="${{ secrets.KEYSTORE_PASS }}"
          export ALIAS_NAME="${{ secrets.ALIAS_NAME }}"
          export ALIAS_PASS="${{ secrets.ALIAS_PASS }}"
          ./run init action gradle
          ./gradlew app:assemblePreviewRelease
          APK=$(find app/build/outputs/apk -name '*arm64-v8a*.apk')
          APK=$(dirname $APK)
          echo "APK=$APK" >> $GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: APKs
          path: ${{ env.APK }}
